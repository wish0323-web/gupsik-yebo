<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>급식 예보 · 등교 브리핑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&display=swap">
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#101a3a;--mute:#5a6585;--line:#d9dfef;--main:#2236ff;--gold:#ffd23f;--warn:#d62839;--warn-bg:#ffe6e9;--ok:#0f8a5f;--ok-bg:#dff6ea;--font:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d1424;--card:#16203a;--ink:#eaf0ff;--mute:#9aa8c7;--line:#26335a;--main:#8ea2ff;--warn:#ff6b7a;--warn-bg:#3a1a24;--ok:#4fd6a0;--ok-bg:#123a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;word-break:keep-all}
.app{max-width:760px;margin:0 auto;padding:16px}
h1{margin:0;font-size:24px;font-weight:900}
h2{margin:0 0 8px;font-size:18px;font-weight:900}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.school{color:var(--mute);font-weight:700;font-size:14px}
button,input{font:inherit}
button{cursor:pointer}
.btn{background:var(--main);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.results{display:grid;gap:6px;margin-top:8px}
.results button{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.results small{display:block;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:900}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.advice{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.advice li{padding:9px 12px;border-radius:10px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.advice li.w{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:13px;color:var(--mute);font-weight:700}
.tray{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dish{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;background:var(--bg)}
.dish.bad{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.dish small{display:block;font-weight:500;color:var(--mute)}
.dish.bad small{color:var(--warn)}
.row{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .d{font-weight:900}
.row .d small{display:block;color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{padding:2px 9px;border-radius:99px;font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.chip.bad{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--main)}
details{margin-top:6px}
summary{cursor:pointer;font-weight:700;color:var(--main)}
.nt{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 12px;font-size:14px;margin-top:6px}
.nt span:nth-child(odd){color:var(--mute)}
.algs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin-top:8px}
.algs label{display:flex;gap:6px;align-items:center;font-size:14px}
.msg{color:var(--mute);font-weight:700;padding:6px 0}
.err{color:var(--warn)}
.stars{display:flex;gap:6px}.stars button{font-size:32px;background:none;border:0;color:var(--line);padding:0 2px}.stars button.on{color:var(--gold)}
.foot{color:var(--mute);font-size:12.5px;margin-top:8px}
.hero{background:var(--main);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px}
@media(prefers-color-scheme:dark){.hero{color:#0d1424}}
.hl{font-weight:700;opacity:.85}
.big{font-size:64px;font-weight:900;line-height:1.1;margin:4px 0}
.big small{font-size:22px;margin-left:4px}
.hs{font-size:18px;font-weight:900}
.hint{font-size:13px;opacity:.85;margin:10px 0 0}
.gold{background:var(--gold);color:#101a3a;margin-top:10px}
.dish{cursor:pointer}.dish.like,.chip.like{border-color:var(--main);background:var(--card);color:var(--main)}
.dish.dislike,.chip.dislike{border-style:dashed;color:var(--mute);text-decoration:line-through}
.chip[data-n]{cursor:pointer}
.sc{font-weight:900;font-size:15px}
.best{background:var(--gold);color:#101a3a;border-radius:10px;padding:8px 12px;font-weight:900;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{text-align:center;font-size:13px;color:var(--mute)}
.cell{min-height:54px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:2px;position:relative;font-size:13px}
.cell.hi{background:var(--main);color:#fff;border-color:var(--main)}
.cell.lo{opacity:.55}
.cell.al::after{content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.cell.sel{outline:3px solid var(--gold)}
@media(max-width:480px){.tray{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>급식 예보</h1><div class="school" id="school">학교를 선택해 주세요</div></div>
    <button class="btn ghost" id="change" type="button">학교 바꾸기</button>
  </div>

  <section class="card" id="picker">
    <h2>학교 찾기</h2>
    <div class="search">
      <input id="q" type="text" value="경희중학교" aria-label="학교 이름" placeholder="학교 이름 입력">
      <button class="btn" id="go" type="button">검색</button>
    </div>
    <div class="results" id="results"></div>
  </section>

  <div id="main" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-today" aria-selected="true" type="button">오늘</button>
      <button role="tab" id="tab-week" aria-selected="false" type="button">이번 주</button>
      <button role="tab" id="tab-month" aria-selected="false" type="button">한 달</button>
      <button role="tab" id="tab-me" aria-selected="false" type="button">내 취향</button>
    </div>
    <div id="today"></div>
    <div id="week" hidden></div>
    <div id="month" hidden></div>
    <div id="me" hidden></div>

    <section class="card">
      <details>
        <summary>내 알레르기 설정</summary>
        <div class="algs" id="algs"></div>
        <p class="foot">체크한 성분이 들어간 메뉴는 빨간색으로 표시돼요.</p>
      </details>
    </section>
  </div>

  <p class="foot">자료: 교육부 나이스(NEIS) 교육정보 개방 포털(급식식단·학교정보). 알레르기 정보는 참고용이므로 정확한 내용은 학교 급식실에서 꼭 확인하세요.</p>
</div>

<script>
// 나이스 교육정보 개방 포털(open.neis.go.kr)에서 발급받은 인증키를 아래 따옴표 안에 붙여 넣으세요.
const NEIS_KEY = "ad06a0a6fb594f578ff3cdb576b2a85f";

// 알레르기 번호표: 1~13번은 식약처·학교급식 표시 기준 자료의 순서와 일치함을 확인했어요. 14~19번은 나이스 공식 안내와 꼭 비교해 보세요.
const ALG = ["","난류","우유","메밀","땅콩","대두","밀","고등어","게","새우","돼지고기","복숭아","토마토","아황산류","호두","닭고기","쇠고기","오징어","조개류","잣"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let school = store.get("school", null);
let myAlg = store.get("alg", []);
let taste = store.get("taste", {});
let diary = store.get("diary", {});
let auto = store.get("auto", {});
let monthMeals = [], selDay = null;
let meals = [], events = {}, weather = null, air = null;

const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
const dayName = d => "일월화수목금토"[d.getDay()];
const fromYmd = s => new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));

async function neis(name, params){
  // 인증키가 없으면 나이스는 한 번에 최대 5건만 돌려줘요.
  const p = new URLSearchParams({Type:"json", pSize: NEIS_KEY ? "100" : "5", ...params});
  if (NEIS_KEY) p.set("KEY", NEIS_KEY);
  const res = await fetch("https://open.neis.go.kr/hub/" + name + "?" + p);
  if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
  const data = await res.json();
  if (data[name] && data[name][1]) return data[name][1].row;
  const r = data.RESULT || (data[name] && data[name][0] && data[name][0].head && data[name][0].head[1] && data[name][0].head[1].RESULT);
  if (r && r.CODE && r.CODE !== "INFO-000" && r.CODE !== "INFO-200") throw new Error(r.CODE + " " + r.MESSAGE);
  return [];
}

function parseMenu(r){
  return r.DDISH_NM.split(/<br\s*\/?>/i).map(t => {
    const m = t.trim().match(/^(.*?)\s*\(([\d.]+)\)\s*$/);
    return m ? {name:m[1], alg:m[2].split(".").filter(Boolean).map(Number)} : {name:t.trim(), alg:[]};
  }).filter(x => x.name);
}
function parseNtr(r){
  return (r.NTR_INFO || "").split(/<br\s*\/?>/i).map(t => t.split(":").map(x => x.trim())).filter(a => a.length === 2);
}
const kcal = r => parseFloat(r.CAL_INFO) || 0;
const hitList = menu => [...new Set(menu.flatMap(d => d.alg.filter(a => myAlg.includes(a))))];

/* 학교 검색 */
async function search(){
  const q = $("#q").value.trim();
  const box = $("#results");
  if (!q) return;
  box.innerHTML = '<div class="msg">검색 중…</div>';
  try {
    const rows = await neis("schoolInfo", {SCHUL_NM:q});
    box.innerHTML = rows.length ? "" : '<div class="msg">검색 결과가 없어요. 학교 이름을 다시 확인해 주세요.</div>';
    rows.forEach(r => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = esc(r.SCHUL_NM) + "<small>" + esc(r.ATPT_OFCDC_SC_NM) + " · " + esc(r.ORG_RDNMA || "") + "</small>";
      b.onclick = () => { school = {atpt:r.ATPT_OFCDC_SC_CODE, code:r.SD_SCHUL_CODE, name:r.SCHUL_NM, office:r.ATPT_OFCDC_SC_NM}; store.set("school", school); start(); };
      box.appendChild(b);
    });
  } catch(e){
    box.innerHTML = '<div class="msg err">검색에 실패했어요.<br>원인: ' + esc(e.message) + '<br>인터넷 연결, 인증키, 그리고 파일을 연 방법(GitHub Pages 주소로 열어야 해요)을 확인해 주세요.</div>';
  }
}

/* 데이터 불러오기 */
async function load(){
  $("#today").innerHTML = '<div class="card msg">불러오는 중…</div>';
  const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const f = new Date(now.getFullYear(), now.getMonth(), 1), l = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  const base = {ATPT_OFCDC_SC_CODE:school.atpt, SD_SCHUL_CODE:school.code, MMEAL_SC_CODE:"2"};
  const jobs = await Promise.allSettled([
    neis("mealServiceDietInfo", {...base, MLSV_FROM_YMD:ymd(mon), MLSV_TO_YMD:ymd(sun)}),
    neis("mealServiceDietInfo", {...base, MLSV_FROM_YMD:ymd(f), MLSV_TO_YMD:ymd(l)})
  ]);
  meals = jobs[0].status === "fulfilled" ? jobs[0].value : [];
  monthMeals = jobs[1].status === "fulfilled" ? jobs[1].value : [];
  if (jobs[0].status === "rejected" && jobs[1].status === "rejected"){
    $("#today").innerHTML = '<div class="card msg err">급식 정보를 불러오지 못했어요.<br>원인: ' + esc(jobs[0].reason.message) + "</div>"; return;
  }
  renderToday(); renderWeek(); renderMonth(); renderMe();
}

/* 오늘 급식 */
function renderToday(){
  const d = new Date(), key = ymd(d);
  const meal = meals.find(m => m.MLSV_YMD === key);
  const menu = meal ? parseMenu(meal) : [];
  const hits = hitList(menu), sc = meal ? score(menu) : 0, tips = [];
  if (meal && hits.length) tips.push(["w", "오늘 급식에 내 알레르기 성분이 있어요: " + hits.map(h => ALG[h]).join(", ")]);
  else if (meal && myAlg.length) tips.push(["", "오늘 급식에는 내가 체크한 알레르기 성분이 없어요."]);
  else if (meal) tips.push(["", "아래 ‘내 알레르기 설정’에서 성분을 체크하면 위험한 메뉴를 알려 줘요."]);
  if (!meal) tips.push(["", "오늘은 급식 정보가 없어요. 방학이나 휴업일일 수 있어요."]);
  const nx = new Date(d); nx.setDate(d.getDate() + 1);
  const tm = meals.find(m => m.MLSV_YMD === ymd(nx));
  if (tm){ const tmn = parseMenu(tm), th = hitList(tmn).length; tips.push([th ? "w" : "", "내일 급식 예보 " + icon(score(tmn)) + " " + score(tmn) + "점" + (th ? " · 알레르기 주의" : "") + " — " + tmn.slice(0, 3).map(x => x.name).join(", ") + " 외"]); }
  const rated = diary[key] ? diary[key].s : 0;
  const hero = '<section class="hero"><div class="hl">오늘의 급식 예보</div>' + (meal
    ? '<div class="big">' + icon(sc) + " " + sc + '<small>점</small></div><div class="hs">' + label(sc) + (hits.length ? " · 알레르기 주의" : "") + '</div><button class="btn gold" id="share" type="button">예보 복사하기</button>'
    : '<div class="hs">오늘은 급식이 없어요</div>') + '<p class="hint">메뉴를 누르면 ♥ 좋아요 → ✕ 싫어요 → 해제 순서로 바뀌어요. 취향을 알려 줄수록 예보가 나에게 맞춰져요.</p></section>';
  $("#today").innerHTML = hero + '<section class="card"><h2>' + (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + dayName(d) + ') 점심</h2>' + (meal
      ? '<div class="tray">' + menu.map(dishHtml).join("") + '</div><div class="msg">열량 ' + esc(meal.CAL_INFO) + "</div>"
      : '<div class="msg">급식 정보 없음</div>') + '<ul class="advice">' + tips.map(t => '<li class="' + t[0] + '">' + esc(t[1]) + "</li>").join("") + "</ul></section>" +
    (meal ? '<section class="card"><h2>오늘 급식 어땠어요?</h2><div class="stars">' + [1,2,3,4,5].map(n => '<button type="button" data-star="' + n + '" class="' + (rated >= n ? "on" : "") + '" aria-label="' + n + '점">★</button>').join("") + '</div><div class="msg">별점은 일기에 쌓이고, 높은 별점의 메뉴는 다음 예보에 자동으로 반영돼요.</div></section>' : "");
  const sb = $("#share");
  if (sb) sb.onclick = () => {
    const t = "[급식 예보] " + school.name + " " + (d.getMonth()+1) + "/" + d.getDate() + " " + icon(sc) + " " + sc + "점 · " + label(sc) + "\n" + menu.map(x => x.name).join(", ");
    try { navigator.clipboard.writeText(t).then(() => { sb.textContent = "복사됨!"; }); } catch(e){ sb.textContent = "복사 실패"; }
  };
}
const clamp = n => Math.max(0, Math.min(100, n));
function score(menu){
  let v = 50;
  menu.forEach(x => {
    if (taste[x.name] === 1) v += 18;
    else if (taste[x.name] === -1) v -= 22;
    else if (auto[x.name]) v += Math.max(-12, Math.min(12, auto[x.name] * 4));
  });
  return clamp(v);
}
const icon = v => v >= 75 ? "☀️" : v >= 50 ? "⛅" : v >= 30 ? "☁️" : "🌧";
const label = v => v >= 75 ? "맑음 · 기대되는 급식" : v >= 50 ? "구름 조금 · 무난한 급식" : v >= 30 ? "흐림 · 아쉬운 메뉴가 있어요" : "비 · 도시락을 고민해 보세요";
const tcls = x => x.alg.some(a => myAlg.includes(a)) ? " bad" : taste[x.name] === 1 ? " like" : taste[x.name] === -1 ? " dislike" : "";
const mark = x => taste[x.name] === 1 ? "♥ " : taste[x.name] === -1 ? "✕ " : "";
function dishHtml(x){
  return '<div class="dish' + tcls(x) + '" data-n="' + esc(x.name) + '">' + mark(x) + esc(x.name) + (x.alg.length ? "<small>" + x.alg.map(a => ALG[a] || a).join(", ") + "</small>" : "") + "</div>";
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-n]");
  if (!el) return;
  const n = el.dataset.n;
  taste[n] = taste[n] === 1 ? -1 : taste[n] === -1 ? 0 : 1;
  if (!taste[n]) delete taste[n];
  store.set("taste", taste); renderToday(); renderWeek(); renderMonth(); renderMe();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-star]");
  if (!b) return;
  const key = ymd(new Date()), meal = meals.find(m => m.MLSV_YMD === key);
  const n = +b.dataset.star, prev = diary[key] ? diary[key].s - 3 : 0, delta = n - 3 - prev;
  if (meal && delta) parseMenu(meal).forEach(x => { auto[x.name] = (auto[x.name] || 0) + delta; });
  diary[key] = {s: n, m: meal ? parseMenu(meal).slice(0, 3).map(x => x.name).join(", ") : ""};
  store.set("auto", auto); store.set("diary", diary); renderToday(); renderMe();
});

/* 이번 주 급식 */
function renderWeek(){
  if (!meals.length){ $("#week").innerHTML = '<div class="card msg">이번 주 급식 정보가 없어요.</div>'; return; }
  const max = Math.max(...meals.map(kcal), 1);
  const safe = meals.filter(m => !hitList(parseMenu(m)).length);
  const top = safe.slice().sort((p, q) => score(parseMenu(q)) - score(parseMenu(p)))[0];
  const td = top ? fromYmd(top.MLSV_YMD) : null;
  $("#week").innerHTML = (top ? '<div class="best">이번 주 베스트 급식: ' + dayName(td) + "요일 " + icon(score(parseMenu(top))) + " " + score(parseMenu(top)) + "점</div>" : "") +
    '<section class="card"><h2>이번 주 점심 예보</h2>' + meals.map(m => {
    const d = fromYmd(m.MLSV_YMD), menu = parseMenu(m), hits = hitList(menu), ntr = parseNtr(m), sc = score(menu);
    return '<div class="row"><div class="d">' + (d.getMonth()+1) + "/" + d.getDate() + "<small>" + dayName(d) + '요일</small><span class="sc">' + icon(sc) + " " + sc + '</span></div><div>' +
      '<div class="chips">' + menu.map(x => '<span class="chip' + tcls(x) + '" data-n="' + esc(x.name) + '">' + mark(x) + esc(x.name) + "</span>").join("") + "</div>" +
      (hits.length ? '<div class="msg err">주의: ' + hits.map(h => ALG[h]).join(", ") + "</div>" : "") +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(kcal(m) / max * 100) + '%"></i></div><div class="msg">' + esc(m.CAL_INFO) + "</div>" +
      (ntr.length ? '<details><summary>영양 정보</summary><div class="nt">' + ntr.map(n => "<span>" + esc(n[0]) + "</span><span>" + esc(n[1]) + "</span>").join("") + "</div></details>" : "") +
      "</div></div>";
  }).join("") + "</section>";
}

/* 한 달 예보 */
function renderMonth(){
  if (!monthMeals.length){ $("#month").innerHTML = '<div class="card msg">이번 달 급식 정보가 없어요.</div>'; return; }
  const first = fromYmd(monthMeals[0].MLSV_YMD), by = {};
  monthMeals.forEach(m => by[m.MLSV_YMD] = m);
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), last = new Date(y, mo + 1, 0).getDate();
  let cells = "일월화수목금토".split("").map(c => "<b>" + c + "</b>").join("") + '<span></span>'.repeat(new Date(y, mo, 1).getDay());
  for (let i = 1; i <= last; i++){
    const k = y + String(mo+1).padStart(2,"0") + String(i).padStart(2,"0"), m = by[k];
    if (!m){ cells += '<span class="cell" style="opacity:.3;display:grid;place-items:center">' + i + "</span>"; continue; }
    const menu = parseMenu(m), sc = score(menu);
    cells += '<button type="button" class="cell' + (sc >= 75 ? " hi" : sc < 50 ? " lo" : "") + (hitList(menu).length ? " al" : "") + (selDay === k ? " sel" : "") + '" data-day="' + k + '">' + i + "<br>" + icon(sc) + "</button>";
  }
  let det = '<div class="msg">날짜를 누르면 메뉴가 보여요. 파란 칸은 기대되는 날, 빨간 점은 알레르기 주의예요.</div>';
  if (selDay && by[selDay]){
    const m = by[selDay], menu = parseMenu(m), hits = hitList(menu);
    det = '<div class="tray">' + menu.map(dishHtml).join("") + '</div>' + (hits.length ? '<div class="msg err">주의: ' + hits.map(h => ALG[h]).join(", ") + "</div>" : "") + '<div class="msg">' + esc(m.CAL_INFO) + "</div>";
  }
  const ks = monthMeals.map(kcal).filter(Boolean), avg = ks.length ? Math.round(ks.reduce((a, b) => a + b, 0) / ks.length) : 0;
  const cnt = {}; monthMeals.forEach(m => parseMenu(m).forEach(x => cnt[x.name] = (cnt[x.name] || 0) + 1));
  const topD = Object.entries(cnt).filter(e => e[1] > 1).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0] + " " + e[1] + "회").join(", ") || "아직 반복 메뉴 없음";
  const hot = monthMeals.slice().sort((a, b) => kcal(b) - kcal(a))[0];
  const stats = '<section class="card"><h2>이번 달 급식 통계</h2><div class="stats"><div class="stat"><b>' + avg + '</b><span>평균 kcal</span></div><div class="stat"><b>' + (hot ? Number(hot.MLSV_YMD.slice(6)) + "일" : "-") + '</b><span>열량 최고일</span></div><div class="stat"><b style="font-size:14px">' + esc(topD) + "</b><span>자주 나온 메뉴</span></div></div></section>";
  const note = !NEIS_KEY && monthMeals.length <= 5 ? '<div class="msg err">인증키가 없어서 5일치만 보여요. 코드에 NEIS_KEY를 넣어 주세요.</div>' : "";
  $("#month").innerHTML = '<section class="card"><h2>' + (mo+1) + '월 급식 예보 달력</h2>' + note + '<div class="cal">' + cells + '</div></section><section class="card">' + det + "</section>" + stats;
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { selDay = b.dataset.day; renderMonth(); });
}

/* 내 취향 · 일기 · 궁합 */
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = t => JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
function renderMe(){
  const el = $("#me"); if (!el) return;
  const L = Object.keys(taste).filter(k => taste[k] === 1), D = Object.keys(taste).filter(k => taste[k] === -1);
  const days = Object.keys(diary).sort().reverse();
  const avg = days.length ? (days.reduce((a, k) => a + diary[k].s, 0) / days.length).toFixed(1) : "-";
  const chips = L.map(n => '<span class="chip like" data-n="' + esc(n) + '">♥ ' + esc(n) + "</span>").concat(D.map(n => '<span class="chip dislike" data-n="' + esc(n) + '">✕ ' + esc(n) + "</span>")).join("");
  el.innerHTML = '<section class="card"><h2>내 급식 일기</h2>' + (days.length
      ? '<div class="msg">평균 ★' + avg + " · 기록 " + days.length + "일</div>" + days.slice(0, 10).map(k => '<div class="row"><div class="d">' + k.slice(4,6) + "/" + k.slice(6) + '<small>' + "★".repeat(diary[k].s) + '</small></div><div class="msg">' + esc(diary[k].m) + "</div></div>").join("")
      : '<div class="msg">오늘 탭에서 별점을 남기면 여기에 쌓여요.</div>') + "</section>" +
    '<section class="card"><h2>내 취향</h2><div class="chips">' + (chips || '<span class="msg">메뉴를 눌러 ♥ 좋아요나 ✕ 싫어요를 남겨 보세요.</span>') + "</div></section>" +
    '<section class="card"><h2>친구와 급식 궁합</h2><button class="btn" id="mycode" type="button">내 취향 코드 복사</button><div class="search" style="margin-top:8px"><input id="fcode" type="text" placeholder="친구의 코드 붙여넣기" aria-label="친구 코드"><button class="btn" id="cmp" type="button">궁합 보기</button></div><div class="msg" id="cres"></div><div class="msg">코드는 좋아요·싫어요 메뉴 이름만 담겨 있어요.</div></section>' +
    '<section class="card"><h2>우리 반 급식 취향 합치기</h2><div class="msg">친구들의 코드를 한 줄에 하나씩 붙여 넣으면, 서버 없이 반 전체의 인기 메뉴를 뽑아 줘요.</div><textarea id="gcodes" rows="3" style="width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit" aria-label="친구 코드 여러 개"></textarea><button class="btn" id="grp" type="button" style="margin-top:8px">합쳐 보기</button><div class="msg" id="gres"></div></section>';
  $("#mycode").onclick = () => { try { navigator.clipboard.writeText(enc({l:L, d:D})).then(() => { $("#cres").textContent = "내 코드를 복사했어요. 친구에게 보내 보세요."; }); } catch(e){ $("#cres").textContent = "복사에 실패했어요."; } };
  $("#cmp").onclick = () => {
    try {
      const f = dec($("#fcode").value), fl = f.l || [], fd = f.d || [];
      const ok = L.filter(x => fl.includes(x)).length + D.filter(x => fd.includes(x)).length;
      const bad = L.filter(x => fd.includes(x)).length + D.filter(x => fl.includes(x)).length;
      const both = new Set([...L, ...D].filter(x => [...fl, ...fd].includes(x))).size;
      if (!both) $("#cres").textContent = "둘 다 평가한 메뉴가 아직 없어요. 메뉴를 더 눌러 보세요.";
      else $("#cres").textContent = "급식 궁합 " + clamp(Math.round(50 + (ok - bad) / both * 50)) + "% (둘 다 평가한 메뉴 " + both + "개)";
    } catch(e){ $("#cres").textContent = "코드를 읽을 수 없어요. 다시 복사해 주세요."; }
  };
  $("#grp").onclick = () => {
    const likes = {}, dis = {}; let n = 1;
    L.forEach(x => likes[x] = 1); D.forEach(x => dis[x] = 1);
    $("#gcodes").value.split(/\s+/).filter(Boolean).forEach(t => {
      try { const f = dec(t); (f.l || []).forEach(x => likes[x] = (likes[x] || 0) + 1); (f.d || []).forEach(x => dis[x] = (dis[x] || 0) + 1); n++; } catch(e){}
    });
    const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0] + " (" + e[1] + "명)").join(", ") || "아직 없어요";
    $("#gres").innerHTML = "참여 " + n + "명<br>♥ 인기 메뉴: " + esc(top(likes)) + "<br>✕ 비인기 메뉴: " + esc(top(dis));
  };
}

/* 알레르기 설정 */
function buildAlgs(){
  $("#algs").innerHTML = ALG.map((n, i) => i ? '<label><input type="checkbox" value="' + i + '"' + (myAlg.includes(i) ? " checked" : "") + "> " + i + ". " + n + "</label>" : "").join("");
  $("#algs").onchange = () => {
    myAlg = [...document.querySelectorAll("#algs input:checked")].map(c => +c.value);
    store.set("alg", myAlg); renderToday(); renderWeek();
  };
}

function showTab(t){
  ["today","week","month","me"].forEach(k => { $("#tab-"+k).setAttribute("aria-selected", k === t); $("#"+k).hidden = k !== t; });
}
function start(){
  $("#picker").hidden = true; $("#main").hidden = false;
  $("#school").textContent = school.name;
  buildAlgs(); showTab("today"); load();
}
$("#go").onclick = search;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
$("#change").onclick = () => { $("#picker").hidden = false; $("#main").hidden = true; };
$("#tab-today").onclick = () => showTab("today");
$("#tab-week").onclick = () => showTab("week");
$("#tab-month").onclick = () => showTab("month");
$("#tab-me").onclick = () => showTab("me");
if (school) start();
</script>
